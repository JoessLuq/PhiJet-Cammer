<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EV Camera</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
       background:linear-gradient(#000a,#0000);font-variant-numeric:tabular-nums}
  #ev{font-size:44px;font-weight:700}
  #info{font-size:13px;opacity:.85}
  #bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;
       padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 18px);background:linear-gradient(#0000,#000b)}
  #shot{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff3;cursor:pointer}
  label{font-size:13px}
  input{width:56px;padding:4px;border-radius:6px;border:0;font-size:15px}
  #msg{position:absolute;top:45%;left:0;right:0;text-align:center;padding:0 20px}
</style>
</head>
<body>
<video id="v" playsinline autoplay muted></video>
<div id="hud"><div id="ev">-- EV</div><div id="info">Starting camera…</div></div>
<div id="msg"></div>
<div id="bar">
  <label>f/ <input id="ap" type="number" step="0.1" min="1" value="1.8"></label>
  <button id="shot" aria-label="Take snapshot"></button>
  <label>Offset <input id="off" type="number" step="0.1" value="0"></label>
</div>
<canvas id="c" hidden></canvas>
<script>
const v=document.getElementById('v'), evEl=document.getElementById('ev'),
      info=document.getElementById('info'), msg=document.getElementById('msg'),
      apEl=document.getElementById('ap'), offEl=document.getElementById('off');
const small=document.createElement('canvas'); small.width=small.height=32;
const sctx=small.getContext('2d',{willReadFrequently:true});
let track=null, current={ev:null,rel:null,t:null,iso:null,lum:null};

const lin=c=>Math.pow(c/255,2.2);

function measure(){
  if(!v.videoWidth) return;
  sctx.drawImage(v,0,0,32,32);
  const d=sctx.getImageData(0,0,32,32).data; let sum=0;
  for(let i=0;i<d.length;i+=4) sum+=0.2126*lin(d[i])+0.7152*lin(d[i+1])+0.0722*lin(d[i+2]);
  const L=Math.max(sum/1024,1e-4);
  const rel=Math.log2(L/0.18);             // stops vs 18% gray
  const s=track&&track.getSettings?track.getSettings():{};
  // Chrome reports exposureTime in units of 100 microseconds
  const t=s.exposureTime?s.exposureTime/10000:null, iso=s.iso||null;
  const N=parseFloat(apEl.value)||1.8, off=parseFloat(offEl.value)||0;
  let ev=null;
  if(t&&iso) ev=Math.log2(N*N/t)-Math.log2(iso/100)+rel+off;
  current={ev,rel,t,iso,lum:L,N};
  if(ev!==null){
    evEl.textContent='EV '+ev.toFixed(1);
    info.textContent=`ISO ${iso} · 1/${Math.round(1/t)}s · f/${N} · EV100`;
  }else{
    evEl.textContent=(rel>=0?'+':'')+rel.toFixed(1)+' stops';
    info.textContent='Relative brightness vs mid-gray (exposure data not available on this browser)';
  }
}

async function start(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream; track=stream.getVideoTracks()[0];
    try{ await track.applyConstraints({advanced:[{exposureMode:'continuous'}]}); }catch(e){}
    setInterval(measure,300);
  }catch(e){
    msg.textContent='Camera unavailable: '+e.message+' (HTTPS and camera permission required)';
  }
}

document.getElementById('shot').onclick=async()=>{
  if(!v.videoWidth) return;
  measure();
  const w=v.videoWidth,h=v.videoHeight,bar=Math.round(h*0.07);
  const c=document.getElementById('c'); c.width=w; c.height=h+bar;
  const x=c.getContext('2d');
  x.drawImage(v,0,0,w,h);
  x.fillStyle='#000'; x.fillRect(0,h,w,bar);
  x.fillStyle='#fff'; x.textBaseline='middle'; x.font=`${Math.round(bar*0.5)}px system-ui,sans-serif`;
  const c0=current;
  const txt=c0.ev!==null
    ?`EV ${c0.ev.toFixed(1)}  |  ISO ${c0.iso}  1/${Math.round(1/c0.t)}s  f/${c0.N}  |  ${new Date().toLocaleString()}`
    :`Rel. ${c0.rel.toFixed(1)} stops vs mid-gray  |  ${new Date().toLocaleString()}`;
  x.fillText(txt,bar*0.4,h+bar/2);
  c.toBlob(async b=>{
    const name=`EV_${Date.now()}.jpg`, file=new File([b],name,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  },'image/jpeg',0.9);
};

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
start();
</script>
</body>
</html>
